<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>My To-Do List</h1>

            <button id="themeButton">🌙</button>
        </div>

        <p class="subtitle">Organize your day and get things done!</p>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">Add Task</button>

        </div>

        <div class="task-info">
            <span>Total Tasks: <b id="taskCount">0</b></span>
            <span>Completed: <b id="completedCount">0</b></span>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
